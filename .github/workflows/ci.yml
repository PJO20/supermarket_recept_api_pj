name: "CI"

"on": ["push", "pull_request"]

permissions:
  contents: "read"

jobs:
  ci:
    name: "CI - ${{ matrix.check }}"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    strategy:
      matrix:
        check: ["lint", "format", "tests"]
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Installer Python et uv"
        uses: "astral-sh/setup-uv@v10.2.0"
        with:
          python-version: "3.13"
          enable-cache: false

      - name: "Installer les dépendances"
        run: "uv sync --locked"

      - name: "Lint (ruff check)"
        if: "matrix.check == 'lint'"
        run: "uv run ruff check ."

      - name: "Format (ruff format --check)"
        if: "matrix.check == 'format'"
        run: "uv run ruff format --check ."

      - name: "Tests unitaires et d'intégration avec couverture"
        if: "matrix.check == 'tests'"
        run: "uv run pytest tests/unit tests/integration --cov=supermarket_receipt_api.checkout --cov-report=term-missing"